---
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: create-trusted-artifact-array
spec:
  description: >-
    This stepaction creates trusted artifacts. It does nothing if a .skip-trusted-artifacts file exists
    in root folder.
  image: quay.io/redhat-appstudio/build-trusted-artifacts@sha256:9de805309da402787ddb4ad350570ff03437ef513abb1e2256497fbeef306cee
  env:
    # Set HOME variable to something else than `/` to avoid 'permission denied' problems when writing files.
    - name: HOME
      value: /tekton/home
  params:
    - name: ociStorage
      type: string
      default: "empty"
    - name: sourceDataArtifacts
      type: array
      default: []
  args:
    - create
    - --store
    - $(params.ociStorage)
    - "$(params.sourceDataArtifacts[*])"
