---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-check-embargoed-cves-task-no-embargo
spec:
  description: |
    Run the check-embargoed-cves task with no embargoed CVEs. The result
    task result should be Success and the embargoed_cves result should be empty
  tasks:
    - name: run-task
      taskRef:
        name: check-embargoed-cves-task
      params:
        - name: cves
          value: "CVE-123 CVE-456"
    - name: check-result
      runAfter:
        - run-task
      params:
        - name: result
          value: $(tasks.run-task.results.result)
        - name: embargoed_cves
          value: $(tasks.run-task.results.embargoed_cves)
      taskSpec:
        params:
          - name: result
            type: string
          - name: embargoed_cves
            type: string
        steps:
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:74b1c441ec73b6bbb799305a3cf2929cbc91ce2e9f5fb830765646ca89af67ac@sha256:60ad36876afdb0e50ec14ad8dc20d736ff0a7e93344d7a4cc2a53bf8dbaafc4b82012e03002128f2a226acb23dc5c6fc1c37f5b6
            script: |
              #!/usr/bin/env bash
              set -eux

              if [ "$(params.result)" != Success ]; then
                echo Error: result task result is not correct
                exit 1
              fi

              if [ "$(params.embargoed_cves)" != "" ]; then
                echo Error: embargoed_cves task result is not correct
                exit 1
              fi
